name: Build & Prepare Release

env:
  CI: 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The version bump comes from the "## [Unreleased (patch|minor|major)]"
  # heading in CHANGELOG.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]

    steps:
      - name: Validate the manual release ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies with the frozen lockfile
        if: ${{ matrix.node-version != 22 }}
        run: npm ci --ignore-scripts
      - name: Install dependencies with the npm bundled with Node.js 22
        # Node.js 22 still bundles npm 10.9, which is below the devEngines
        # floor and refuses to install without being forced. The lockfile
        # pins every resolution either way.
        if: ${{ matrix.node-version == 22 }}
        run: npm_config_force=true npm ci --ignore-scripts
      - name: Test
        # Invoke the test runner directly so npm_config_force stays scoped to
        # the install above.
        run: node test.js
      - name: Test the oldest supported peer
        # Keeps the peerDependencies floor honest: the lockfile tracks the
        # newest peer, so nothing else would catch a change that quietly
        # requires more than the declared minimum. Runs on a lane whose
        # bundled npm clears devEngines, so this install needs no forcing.
        # `make preflight` runs the same script.
        if: ${{ matrix.node-version == 24 }}
        run: npm run test:peer-floor
      - name: Verify the tested source stayed unchanged
        run: git diff --exit-code

  changelog:
    name: Read the version bump from CHANGELOG.md
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Unreleased heading
        id: bump
        uses: photostructure/changelog-release-action@2319f91de9a32bccbb3996cd674df93ba5160d1a # v0.2.0
        with:
          command: bump

  release:
    name: Create signed release commit and tag
    runs-on: ubuntu-24.04
    needs: [build, changelog]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    concurrency:
      group: ${{ github.repository }}-release
      cancel-in-progress: false
      queue: single
    permissions:
      contents: write # Push the release commit and signed tag.
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This isolated job must push the release commit and tag. It installs
          # no dependencies and has no npm publishing authority.
          persist-credentials: true

      - name: Verify the release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]]; then
            echo "::error::$DEFAULT_BRANCH moved after this release run started; run it again"
            exit 1
          fi

      - name: Install the release Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2 # bundles npm 11.19.1; staged publishing needs >= 11.15
          package-manager-cache: false

      - name: Bump the package version
        id: version
        env:
          BUMP: ${{ needs.changelog.outputs.bump }}
        run: |
          set -euo pipefail

          case "$BUMP" in
            patch|minor|major) ;;
            *)
              echo "::error::Unsupported version bump: $BUMP"
              exit 1
              ;;
          esac

          npm version "$BUMP" --no-git-tag-version --ignore-scripts

          if ! git diff --quiet -- . \
            ':(exclude)package.json' \
            ':(exclude)package-lock.json'; then
            echo "::error::The version bump changed unexpected files"
            git diff --name-only
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const pkg = require("./package.json")
            const lock = require("./package-lock.json")
            if (lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
              throw new Error("package.json and package-lock.json versions do not match")
            }
          '
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the release section of CHANGELOG.md
        uses: photostructure/changelog-release-action@2319f91de9a32bccbb3996cd674df93ba5160d1a # v0.2.0
        with:
          command: stamp
          tag: ${{ steps.version.outputs.tag }}

      # Load the signing key after the CHANGELOG.md stamp, so
      # changelog-release-action, which .pinact.yaml exempts from the 14-day
      # cooldown, cannot read the key file while it runs. It still shares this
      # job, so it could leave behind code that runs in the later steps.
      - name: Set up SSH signing
        uses: photostructure/git-ssh-signing-action@abd2a642ab7d704f66193472b47c72375d85a0c1 # v2.0.1
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Create the signed release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release $VERSION"
          git tag -m "Release $VERSION" "$TAG"

      - name: Push the commit and tag atomically
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push --atomic origin \
            "HEAD:refs/heads/$DEFAULT_BRANCH" \
            "refs/tags/$TAG"

  dispatch:
    name: Start tag-bound publishing
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      actions: write # Dispatch publish.yaml at the newly created tag.
    steps:
      - name: Start the tag-bound publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
